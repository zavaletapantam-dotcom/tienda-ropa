<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda · Tu Marca</title>
<meta name="description" content="Catálogo completo de ropa para hombre: polos, camisas, poleras, pantalones, jeans, casacas y blazers.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="tienda">

<main>
  <section class="page-hero">
    <img id="shopHeroImg" src="img/camisas-dobladas.jpg" alt="">
    <div class="wrap">
      <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a><span aria-hidden="true">/</span><span id="shopCrumb">Tienda</span></nav>
      <h1 id="shopTitle">Tienda</h1>
      <p id="shopSub">Encuentra tu próxima prenda favorita. Consulta tallas y stock por WhatsApp.</p>
    </div>
  </section>

  <section class="shop" id="shopTop">
    <div class="wrap shop__layout">
      <div class="f-overlay" id="fOverlay" data-close-filters></div>
      <aside class="filters" id="filters" aria-label="Filtros">
        <div class="filters__head"><h2>Filtros</h2><button type="button" class="icon-btn" data-close-filters aria-label="Cerrar filtros"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div class="f-group"><h2>Categorías</h2><div class="f-list" id="fCats"></div></div>
        <div class="f-group"><h2>Colecciones</h2><div class="f-list" id="fCols"></div></div>
        <div class="f-group"><h2>Talla</h2><div class="f-sizes" id="fSizes"></div></div>
        <div class="f-group">
          <h2>Precio (S/)</h2>
          <form id="fPrice">
            <div class="f-price">
              <input type="number" id="fMin" inputmode="numeric" min="0" placeholder="Mín" aria-label="Precio mínimo">
              <span aria-hidden="true">—</span>
              <input type="number" id="fMax" inputmode="numeric" min="0" placeholder="Máx" aria-label="Precio máximo">
            </div>
            <button type="submit" class="btn btn--dark f-apply">Aplicar</button>
          </form>
        </div>
        <div class="f-group"><label class="f-toggle" for="fDeals">Solo ofertas<input type="checkbox" id="fDeals"></label></div>
        <button type="button" class="f-clear" id="fClear">Limpiar filtros</button>
      </aside>

      <div>
        <div class="shop-cats" id="shopCats" aria-label="Categorías"></div>
        <div class="shop__bar">
          <p class="shop__count" id="shopCount"></p>
          <div class="shop__tools">
            <button type="button" class="filters-btn" id="openFilters">Filtros</button>
            <label class="sort" for="fSort"><span>Ordenar:</span><select id="fSort"></select></label>
          </div>
        </div>
        <div class="chips" id="chips" hidden></div>
        <div class="grid" id="grid"></div>
        <nav class="pager" id="pager" aria-label="Paginación"></nav>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/datos.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
