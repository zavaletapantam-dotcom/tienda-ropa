<body data-page="tienda">

<main>
  <section class="page-hero">
    <img src="img/camisas-dobladas-800.f233f374.webp" srcset="img/camisas-dobladas-400.8da0bbe7.webp 400w, img/camisas-dobladas-800.f233f374.webp 800w, img/camisas-dobladas-1200.c75f64f6.webp 1200w, img/camisas-dobladas-1400.c1872ea6.webp 1400w" sizes="100vw" decoding="async" id="shopHeroImg" data-foto="camisas-dobladas.jpg" data-sizes="100vw" alt="" fetchpriority="high">
    <div class="wrap">
      <nav class="crumbs" aria-label="Ruta"><a href="index.html#elegir">Inicio</a><span aria-hidden="true">/</span><span id="shopCrumb">Tienda</span></nav>
      <h1 id="shopTitle">Tienda</h1>
      <p id="shopSub">Street y Old Money en un solo lugar. Consulta tallas y stock por WhatsApp.</p>
    </div>
  </section>

  <section class="shop" id="shopTop">
    <div class="wrap shop__layout">
      <div class="f-overlay" id="fOverlay" data-close-filters></div>
      <aside class="filters" id="filters" aria-label="Filtros">
        <div class="filters__head"><h2>Filtros</h2><button type="button" class="icon-btn" data-close-filters aria-label="Cerrar filtros"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

        <div class="f-group"><h2>Categorías</h2><div class="f-list" id="fCats"></div></div>
        <div class="f-group"><h2>Talla</h2><div class="f-sizes" id="fSizes"></div></div>
        <div class="f-group">
          <h2>Precio (S/)</h2>
          <form id="fPrice">
            <div class="f-price">
              <input type="number" id="fMin" inputmode="numeric" min="0" placeholder="Mín" aria-label="Precio mínimo">
              <span aria-hidden="true">—</span>
              <input type="number" id="fMax" inputmode="numeric" min="0" placeholder="Máx" aria-label="Precio máximo">
            </div>
            <button type="submit" class="btn btn--dark f-apply">Aplicar</button>
          </form>
        </div>
        <div class="f-group"><label class="f-toggle" for="fDeals">Solo ofertas<input type="checkbox" id="fDeals"></label></div>

      <div>
        <div class="shop-cats" id="shopCats" aria-label="Categorías"></div>
        <div class="shop__bar">
          <p class="shop__count" id="shopCount"></p>
          <div class="shop__tools">
            <button type="button" class="filters-btn" id="openFilters">Filtros</button>
            <label class="sort" for="fSort"><span>Ordenar:</span><select id="fSort"></select></label>
          </div>
        </div>
        <div class="chips" id="chips" hidden></div>
        <div class="grid" id="grid"></div>
        <nav class="pager" id="pager" aria-label="Paginación"></nav>
      </div>
    </div>
